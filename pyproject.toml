[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sepolia-bridge"
version = "1.0.0"
description = "CLI for bridging ETH from Ethereum Sepolia to Arbitrum and Base Sepolia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "web3>=6.0.0",
  "eth-account>=0.8.0",
  "tomli>=1.2.0; python_version<'3.11'",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "allure-pytest>=2.13.0",
]

[project.scripts]
sepolia-bridge = "sepolia_bridge.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "unit: fast pure-logic tests",
  "integration: tests with mocked Web3 / I/O seams",
  "smoke: optional live-network checks (opt-in)",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["sepolia_bridge"]
omit = ["*/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 75
exclude_also = ["raise NotImplementedError"]
